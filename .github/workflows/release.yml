name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Package tracked source and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --output=glass-reach-dashboard.zip HEAD
          gh release create "$RELEASE_TAG" glass-reach-dashboard.zip --verify-tag --draft --title "Glass Reach Dashboard $RELEASE_TAG" --notes-file CHANGELOG.md
